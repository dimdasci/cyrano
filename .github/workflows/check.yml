# Quality gate: runs scripts/check on every push to main and every pull request; a pull request
# also needs a CHANGELOG.md entry. See docs/quality.md and docs/releases.md.
name: check

on:
  push:
    branches: [main]
  pull_request:
    # Adding or removing the skip-changelog label checks again.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Xcode 27 is needed for the macOS 27 SDK; the image is a GitHub preview.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number is the commit count on HEAD (scripts/set-build-number); a shallow
          # clone would make it 1.
          fetch-depth: 0
      - name: Changelog entry
        # User-visible changes go under [Unreleased]; a PR without them (docs, CI, refactoring)
        # carries the skip-changelog label.
        if: >-
          github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md || {
            echo "::error::Describe the change under [Unreleased] in CHANGELOG.md, or label the PR skip-changelog."
            exit 1
          }
      - name: Install tools
        run: |
          brew install swiftlint periphery
          npm install -g jscpd@5.4.2
      - name: Tool versions
        run: |
          xcodebuild -version
          swiftlint version
          periphery version
          jscpd --version
      - run: scripts/check
