# Tags a release: when a version change in App/Version.xcconfig lands on main (the merged
# release PR from scripts/release), puts tag v<version> on that main commit. See docs/releases.md.
name: tag

on:
  push:
    branches: [main]
    paths: [App/Version.xcconfig]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number is the commit count on HEAD; the summary reports it.
          fetch-depth: 0
      - name: Tag the version
        run: |
          version=$(sed -n 's/^MARKETING_VERSION = //p' App/Version.xcconfig)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Cyrano $version"
          git push origin "$tag"
          echo "Tagged $tag: version $version, build $(git rev-list --count HEAD)." >> "$GITHUB_STEP_SUMMARY"
