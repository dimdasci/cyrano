# Quality gate: runs scripts/check on every push to main and every pull request.
# See docs/quality.md.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Xcode 27 is needed for the macOS 27 SDK; the image is a GitHub preview.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The build number is the commit count on HEAD (scripts/set-build-number); a shallow
          # clone would make it 1.
          fetch-depth: 0
      - name: Install tools
        run: |
          brew install swiftlint periphery
          npm install -g jscpd@5.4.2
      - name: Tool versions
        run: |
          xcodebuild -version
          swiftlint version
          periphery version
          jscpd --version
      - run: scripts/check
